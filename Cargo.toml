[package]
name = "armature-macros"
version = "0.3.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-macros"
homepage = "https://quinnjr.github.io/armature"
description = "Declarative macros for Armature framework"
keywords = ["macros", "framework", "web"]
categories = ["web-programming", "development-tools::procedural-macro-helpers"]

[dependencies]
armature-core = { version = "0.9" }
serde_json = "1.0"

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
# Required so `tests/macros.rs` compiles: it exercises the `log_error!`
# macro, which expands to an unprefixed `tracing::error!(...)` call.
# `macro_rules!` paths to external crates resolve at the *call* site, not
# the defining crate, so callers of `log_error!` must add their own
# `tracing` dependency (same as callers must supply `armature-core` and
# `serde_json` for the other macros here). This crate only needs `tracing`
# for its own integration tests.
tracing = "0.1"

